name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish src/AdventureTimePatcher.Gui/AdventureTimePatcher.Gui.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:EnableCompressionInSingleFile=true `
            -o publish/win-x64
          Copy-Item publish/win-x64/AdventureTimePatcher.exe publish/AdventureTimePatcher-win-x64.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdventureTimePatcher-win-x64
          path: publish/AdventureTimePatcher-win-x64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish linux-x64
        run: |
          dotnet publish src/AdventureTimePatcher.Cli/AdventureTimePatcher.Cli.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -o publish/linux-x64
          mv publish/linux-x64/AdventureTimePatcherCli publish/AdventureTimePatcher-linux-x64
          chmod +x publish/AdventureTimePatcher-linux-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdventureTimePatcher-linux-x64
          path: publish/AdventureTimePatcher-linux-x64
  release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: publish
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*
